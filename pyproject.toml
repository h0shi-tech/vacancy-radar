[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vacancy-radar"
version = "0.1.0"
description = "A zero-dependency CLI that ranks hh.ru job vacancies against your preferences."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vlad Nikishin" }]
keywords = ["hh.ru", "vacancies", "jobs", "cli", "job-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = []

[project.scripts]
vacancy-radar = "vacancy_radar.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/h0shi-tech/vacancy-radar"
Issues = "https://github.com/h0shi-tech/vacancy-radar/issues"

[tool.setuptools]
packages = ["vacancy_radar"]
